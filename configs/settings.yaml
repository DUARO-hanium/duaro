# DUARO E2E 파이프라인 설정
# 모든 모듈은 하드코딩 대신 이 파일에서 값을 읽는다.

camera:
  # 윈도우 캡처 프로그램이 프레임을 저장하는 공유 디렉토리 (WSL 기준 /mnt/c/... 경로)
  frame_dir: ""

rdk:
  # RDK X5 (z축 리프트 + 턴테이블) 명령 서버
  host: "192.168.137.10"
  port: 0  # RDK X5 쪽 서버 구현 시 확정

act:
  # ACT 추론 관련 설정 (체크포인트·추론 서버 접속 정보 — 구성 확정 후 기입)
  checkpoint: ""

grasp:
  weights: ""  # grasp point 추출 모델 가중치 경로 (git 미포함)

calibration:
  dir: "calibration/camera"  # H_table.json 등 산출물 위치

replay:
  trajectory_dir: "replay/trajectories"

inspection:
  weights: ""  # 검수 모델 가중치 경로 (git 미포함)

web:
  host: "0.0.0.0"
  port: 8000  # 윈도우 브라우저에서 http://localhost:8000 접속

pipeline:
  max_grasp_retries: 3  # grasp 실패 시 뒤척임 후 재시도 최대 횟수
